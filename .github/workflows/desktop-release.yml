name: Build ScreenStash Desktop Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows desktop installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Python sidecar dependencies
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build packaged Python sidecar
        working-directory: ${{ github.workspace }}
        run: |
          pyinstaller --onefile --windowed --clean --noconfirm `
            --name screenstash-sidecar `
            --distpath desktop/src-tauri `
            --workpath desktop/.pyinstaller `
            --specpath desktop/.pyinstaller `
            desktop_sidecar.py

      - name: Build Tauri installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: v__VERSION__
          releaseName: ScreenStash v__VERSION__
          releaseBody: |
            Download the ScreenStash Windows installer below.

            ScreenStash processes screenshots locally. Ollama and Gemma are optional and can be configured after installation.
          releaseDraft: false
          prerelease: false
