[package]
name = "screenstash-desktop"
version = "0.1.9"
description = "Local-first screenshot intelligence for ScreenStash"
authors = ["ScreenStash contributors"]
edition = "2021"
[lib]
name = "screenstash_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2.4", features = [] }
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8", features = ["tray-icon"] }
rusqlite = { version = "0.32", features = ["bundled"] }
url = "2"
[profile.release]
strip = true
lto = true
codegen-units = 1
